# Optional: download LTX-2.5 (Diffusers layout) into the ltx-weights PVC.
# Uses the same hf-token secret as the H3 job (needed if the repo is gated).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ltx-25-download
  namespace: minimax-h3
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: download
          image: python:3.12-slim
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token, optional: true}
            - {name: HF_XET_HIGH_PERFORMANCE, value: "1"}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install -q -U huggingface_hub
              hf download Lightricks/LTX-2.5-Diffusers \
                --local-dir /models/LTX-2.5-Diffusers
          volumeMounts:
            - {name: weights, mountPath: /models}
      volumes:
        - name: weights
          persistentVolumeClaim: {claimName: ltx-weights}
